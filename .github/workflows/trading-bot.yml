name: Crypto Trading Bot 24/7 PERSISTENT

on:
  schedule:
    # Run every 5 minutes to keep process alive
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches: [ main ]

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download AI learning data from previous run
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: ai-brain-persistent
        path: .
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm install
      
    - name: Run trading bot
      env:
        KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
        KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
        USE_REAL_MONEY: true
        USE_FUTURES: true
      run: |
        echo "🤖 Starting Crypto Trading Bot (Persistent AI Brain)..."
        echo "📊 Loading AI learning data from previous runs..."
        timeout 480 node paper-trading-ai.js || echo "✅ Bot cycle completed"
        
    - name: Upload AI brain (persistent learning)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ai-brain-persistent
        path: |
          ai-historical-data.json
          paper-trading-state.json
          ai-log.txt
        retention-days: 90
        overwrite: true
